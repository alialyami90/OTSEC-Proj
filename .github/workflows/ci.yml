# Project CI (A1). Runs the root Go module's vet and tests on Linux and on
# windows/amd64, the site node's primary build (ADR-0007), and the Python
# verification tests (ADR-0003: Python for verification tooling only).
# Tests that need the SEL manual text are environment-gated and skip here.
name: ci
on:
  # A pull request or a push to main that changes only Markdown or other
  # document files skips CI (owner, 2026-10-27 and 2026-11-01). Files under
  # testdata are read by tests, so they still trigger it.
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!**.pdf'
      - '!**.doc'
      - '!**.docx'
      - '!**.pptx'
      - '!**.xlsx'
      - '**/testdata/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!**.pdf'
      - '!**.doc'
      - '!**.docx'
      - '!**.pptx'
      - '!**.xlsx'
      - '**/testdata/**'
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 45 minutes on Windows, so a package that starts late in the go test
    # step still reaches its own -timeout below (B1 and B6, #252; D4-44).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^platform/experiments/'))"
      - run: go vet ./...
      # The CNG key tests (A3, #157) make machine keys, so they need an
      # elevated process; the hosted Windows runner is one. Here they must
      # run, never skip, and -v shows that they did and what the rights
      # probe found. It runs before the full suite so its log is kept when
      # the package fails (A1).
      - name: nodekey CNG tests
        if: runner.os == 'Windows'
        env:
          OTSEC_REQUIRE_ELEVATED: "1"
        run: go test -count=1 -run TestCNG -v ./modules/security/nodekey
      - name: nodekey claims (A6)
        if: runner.os == 'Windows' && !cancelled()
        run: go test -count=1 -run TestA6NodeKey -v ./tests/security
      - name: collector pipe between two services (A6)
        if: runner.os == 'Windows' && !cancelled()
        run: go test -count=1 -run TestA6PipeIdentityServices -v ./tests/security
      # -timeout applies to each package's test binary from its own start,
      # not to the step. On Windows it is 30m, so a slow or hung package
      # dumps its goroutine stacks when it passes 30m; the 45-minute job
      # limit leaves room for packages that start late on a slow runner (B1,
      # #230, #252, D4-22 and D4-44). A green platform/node over 12m is
      # still a finding (D4-22, D4-44). On Windows -v gives each test's time
      # to the budget step below, and tee keeps the log for it.
      - if: runner.os == 'Linux'
        run: go test ./...
      - if: runner.os == 'Windows'
        shell: bash
        # MEASUREMENT ONLY, NOT FOR MERGE (C5, D4-44): the same platform/node
        # on the same runner, parallel, serial, parallel.
        run: |
          for p in 4 1 4; do
            echo "== platform/node with -parallel $p"
            go test -count=1 -timeout 30m -parallel $p ./platform/node 2>&1 | tail -n 3
          done
      # The platform/node budget is 720 s on a green Windows run (D4-22,
      # D4-44). This prints the package's time and its ten slowest tests, and
      # warns when it is over the budget. It never fails the job.
      - name: platform/node time budget (C5)
        if: runner.os == 'Windows' && !cancelled()
        shell: bash
        run: |
          awk -F'\t' -v pkg=otsec.local/otsec/platform/node '
            /^--- (PASS|FAIL): / { split($0, f, " "); d = f[4]; gsub(/[()s]/, "", d); t[n++] = d " " f[3]; next }
            /^(ok|FAIL|\?)[ \t]/ { if ($2 == pkg) { for (i = 0; i < n; i++) print t[i] > "node-tests.txt"; print $3 > "node-total.txt" } n = 0 }
          ' gotest.txt
          if [ ! -s node-total.txt ]; then
            echo "::warning::platform/node has no time in the go test log"
            exit 0
          fi
          total=$(tr -d 's\r\n' < node-total.txt)
          echo "platform/node took ${total} s on Windows. Its ten slowest tests, in seconds:"
          sort -rn node-tests.txt | head -n 10
          if awk -v t="$total" 'BEGIN { exit !(t + 0 > 720) }'; then
            echo "::warning::platform/node took ${total} s on Windows, over its 720 s budget (D4-22, D4-44)"
          fi
      # The test clock's own tests compile only with its tag (D4-40, V-M4).
      # The release build's refusal of the clock runs in the step above
      # (tests/security, TestC6ReleaseBuildsRefuseTheTestClock).
      - name: test clock (C6)
        if: ${{ !cancelled() }}
        run: go test -count=1 -tags otsec_testclock -run TestTestClock ./platform/node ./cmd/...
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1 asyncssh==2.24.1
      # The slice directory runs in the integration and integration-long jobs
      # in required mode; here it would build the binaries and overrun.
      - run: python -m pytest -q --ignore=tests/integration/slice
  # The Phase 2 slice suite (D2-3, P2-A1): A6's harness with rsyslog as the
  # upstream RELP/TLS collector (imrelp, name mode, Direct queue, sync on;
  # D2-9). Required mode turns every check that cannot run into a failure,
  # so a missing rsyslogd or openssl is never read as a pass. Go is set up for
  # the product binaries the suite builds as they merge. The Windows leg runs
  # on the owner's PC (D1-26); rsyslog does not run on Windows.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OTSEC_SLICE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsyslog rsyslog-relp openssl
      - run: rsyslogd -v && openssl version
      - run: python -m pip install pytest==9.1.1 asyncssh==2.24.1
      - run: python -m pytest -q -rs tests/integration/slice --ignore=tests/integration/slice/test_slice_interruptions_e2e.py --ignore=tests/integration/slice/test_slice_buffer_e2e.py --ignore=tests/integration/slice/test_slice_store_full_e2e.py --ignore=tests/integration/slice/test_slice_busy_open_e2e.py --ignore=tests/integration/slice/test_slice_admin_relay_e2e.py --ignore=tests/integration/slice/test_slice_unknown_restart_e2e.py --ignore=tests/integration/slice/test_slice_date_orders_e2e.py --ignore=tests/integration/slice/test_slice_unknown_fill_outage_e2e.py --ignore=tests/integration/slice/test_slice_gtinj_feed_e2e.py
  # The long slice files (7 to 9 minutes each), one job per file so each
  # stays inside its limit and they run beside the integration job, which
  # ignores exactly these (A1, #132; busy_open added by A6 with A1's
  # approval; admin_relay added by A6, #189's check;
  # unknown_restart added by A6, #198's check, with A1's approval;
  # unknown_fill_outage added by B6, #321, by B1's ruling under D2-13;
  # gtinj_feed added by C6, #402, by C1's ruling under D2-13).
  integration-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        file:
          - test_slice_interruptions_e2e.py
          - test_slice_buffer_e2e.py
          - test_slice_store_full_e2e.py
          - test_slice_busy_open_e2e.py
          - test_slice_admin_relay_e2e.py
          - test_slice_unknown_restart_e2e.py
          - test_slice_date_orders_e2e.py
          - test_slice_unknown_fill_outage_e2e.py
          - test_slice_gtinj_feed_e2e.py
    env:
      OTSEC_SLICE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsyslog rsyslog-relp openssl
      - run: rsyslogd -v && openssl version
      - run: python -m pip install pytest==9.1.1 asyncssh==2.24.1
      - run: python -m pytest -q -rs tests/integration/slice/${{ matrix.file }}
