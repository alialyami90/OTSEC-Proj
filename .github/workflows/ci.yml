# Project CI (A1). Runs the root Go module's vet and tests on Linux and on
# windows/amd64, the site node's primary build (ADR-0007), and the Python
# verification tests (ADR-0003: Python for verification tooling only).
# Tests that need the SEL manual text are environment-gated and skip here.
name: ci
on:
  # A pull request or a push to main that changes only Markdown or other
  # document files skips CI (owner, 2026-10-27 and 2026-11-01). Files under
  # testdata are read by tests, so they still trigger it.
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!**.pdf'
      - '!**.doc'
      - '!**.docx'
      - '!**.pptx'
      - '!**.xlsx'
      - '**/testdata/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!**.pdf'
      - '!**.doc'
      - '!**.docx'
      - '!**.pptx'
      - '!**.xlsx'
      - '**/testdata/**'
permissions:
  contents: read
jobs:
  go:
    strategy:
      # A red leg does not cancel the other one, so the Windows leg always
      # gives its own result (D1, on #619).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 45 minutes on Windows, so a package that starts late in the go test
    # step still reaches its own -timeout below (B1 and B6, #252; D4-44).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^platform/experiments/'))"
      - run: go vet ./...
      # The CNG key tests (A3, #157) make machine keys, so they need an
      # elevated process; the hosted Windows runner is one. Here they must
      # run, never skip, and -v shows that they did and what the rights
      # probe found. It runs before the full suite so its log is kept when
      # the package fails (A1).
      - name: nodekey CNG tests
        if: runner.os == 'Windows'
        env:
          OTSEC_REQUIRE_ELEVATED: "1"
        run: go test -count=1 -run TestCNG -v ./modules/security/nodekey
      - name: nodekey claims (A6)
        if: runner.os == 'Windows' && !cancelled()
        run: go test -count=1 -run TestA6NodeKey -v ./tests/security
      - name: collector pipe between two services (A6)
        if: runner.os == 'Windows' && !cancelled()
        run: go test -count=1 -run TestA6PipeIdentityServices -v ./tests/security
      # -timeout applies to each package's test binary from its own start,
      # not to the step. On Windows it is 30m, so a slow or hung package
      # dumps its goroutine stacks when it passes 30m; the 45-minute job
      # limit leaves room for packages that start late on a slow runner (B1,
      # #230, #252, D4-22 and D4-44). A green platform/node over 12m is
      # still a finding (D4-22, D4-44). On Windows -v gives each test's time
      # to the budget step below, and tee keeps the log for it.
      # The forwarder's own rsyslog tests (modules/telemetry/forward/
      # rsyslog_test.go) skip unless rsyslogd with imrelp is installed, and
      # the runner comes without imrelp. So it is installed here, and
      # OTSEC_RSYSLOG_REQUIRED=1 makes a missing rsyslogd or imrelp fail
      # those tests instead of skipping them (D4, P4-D4-F26, and D6,
      # P4-D6-H5, authorized by D1). Linux only: rsyslog does not run on
      # Windows, and the variable is not set there. The tests run a copy of
      # the installed rsyslogd, because its AppArmor profile does not let
      # the installed path read the test's configuration (F-026). The binary
      # the tests copy is the first rsyslogd on PATH. Its SHA-256 is printed
      # here so it can be matched to the hash each test logs. `dpkg --verify`
      # then checks the two packages' installed files against dpkg's
      # recorded checksums. A changed file fails the step, except a changed
      # configuration file (dpkg marks it "c"), such as the image's own
      # /etc/rsyslog.conf, because the tests read none of the packages'
      # configuration files: they write their own (D6 on #620).
      - name: rsyslog with imrelp, for the forwarder's rsyslog tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends rsyslog rsyslog-relp
          rsyslogd -v
          dpkg-query -W rsyslog rsyslog-relp librelp0
          sha256sum "$(readlink -f "$(command -v rsyslogd)")"
          v=$(dpkg --verify rsyslog rsyslog-relp || true)
          echo "dpkg --verify rsyslog rsyslog-relp: ${v:-no changed files}"
          if printf '%s\n' "$v" | grep -Ev '^[^ ]+ c /' | grep -q .; then
            echo "::error::a packaged rsyslog file differs from dpkg's record"; exit 1
          fi
      - if: runner.os == 'Linux'
        env:
          OTSEC_RSYSLOG_REQUIRED: "1"
        run: go test ./...
      # The forwarder's three rsyslog tests again, with -v, so that the log
      # shows each one's --- PASS or --- FAIL rather than only the package's
      # result (D4, P4-D4-F26). OTSEC_RSYSLOG_REQUIRED=1 makes a missing
      # rsyslogd or imrelp a failure, never a skip.
      - name: forwarder against rsyslog (-v)
        if: runner.os == 'Linux' && !cancelled()
        env:
          OTSEC_RSYSLOG_REQUIRED: "1"
        run: go test -count=1 -run 'TestRsyslog' -v ./modules/telemetry/forward
      # F-027's sensor tests again, with -v, so that both go jobs' logs show
      # each one's --- PASS or --- FAIL (D1 on #663, brief P4-4-F27).
      - name: sensor store set tests (-v)
        if: '!cancelled()'
        shell: bash
        run: |
          go test -count=1 -v ./platform/node/sensortest/...
          go test -count=1 -v -run '^(TestHoldRecordUnreadableNodeStarts|TestIntakeRetryRecoversAndRepairs|TestIntakeNotPublishedOnFailedRecovery|TestRunWhileSensorResumeHeld|TestRunAfterSensorFailed|TestForwardSessionsSplit|TestSensorStoreNotOpenForwardingGoesOn|TestSensorSessionUnreachableNamed|TestSensorSessionUnreportedShown|TestSensorStartupAlarmConcurrent)$' ./platform/node
          go test -count=1 -v -run 'TestNewSecondSession|TestSecondSession' ./modules/telemetry/forward
      - if: runner.os == 'Windows'
        shell: bash
        run: go test -v -timeout 30m ./... 2>&1 | tee gotest.txt
      # The platform/node budget is 720 s on a green Windows run (D4-22,
      # D4-44). This prints the package's time and its ten slowest tests, and
      # warns when it is over the budget. It never fails the job.
      - name: platform/node time budget (C5)
        if: runner.os == 'Windows' && !cancelled()
        shell: bash
        run: |
          awk -F'\t' -v pkg=otsec.local/otsec/platform/node '
            /^--- (PASS|FAIL): / { split($0, f, " "); d = f[4]; gsub(/[()s]/, "", d); t[n++] = d " " f[3]; next }
            /^(ok|FAIL|\?)[ \t]/ { if ($2 == pkg) { for (i = 0; i < n; i++) print t[i] > "node-tests.txt"; print $3 > "node-total.txt" } n = 0 }
          ' gotest.txt
          if [ ! -s node-total.txt ]; then
            echo "::warning::platform/node has no time in the go test log"
            exit 0
          fi
          total=$(tr -d 's\r\n' < node-total.txt)
          echo "platform/node took ${total} s on Windows. Its ten slowest tests, in seconds:"
          sort -rn node-tests.txt | head -n 10
          if awk -v t="$total" 'BEGIN { exit !(t + 0 > 720) }'; then
            echo "::warning::platform/node took ${total} s on Windows, over its 720 s budget (D4-22, D4-44)"
          fi
      # The node start timing lines (P4-H2, authorized by D1): each start in
      # the go test log with its per-phase times, their count, and the ten
      # slowest by total. It never fails the job.
      - name: platform/node start times (P4-H2)
        if: runner.os == 'Windows' && !cancelled()
        shell: bash
        run: |
          set +e +o pipefail
          tr -d '\r' < gotest.txt | grep -o 'otsec node start: .*' > node-starts.txt
          echo "$(wc -l < node-starts.txt) node start lines in the go test log. The ten slowest by total:"
          sed -E 's/.* total=([0-9]+)ms.*/\1 &/' node-starts.txt | sort -rn | head -n 10 | cut -d' ' -f2-
          echo "Every start line:"
          cat node-starts.txt
          exit 0
      # The test clock's own tests compile only with its tag (D4-40, V-M4).
      # The release build's refusal of the clock runs in the step above
      # (tests/security, TestC6ReleaseBuildsRefuseTheTestClock).
      - name: test clock (C6)
        if: ${{ !cancelled() }}
        run: go test -count=1 -tags otsec_testclock -run TestTestClock ./platform/node ./cmd/...
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1 asyncssh==2.24.1
      # The slice directory runs in the integration and integration-long jobs
      # in required mode; here it would build the binaries and overrun.
      - run: python -m pytest -q --ignore=tests/integration/slice
  # The Phase 2 slice suite (D2-3, P2-A1): A6's harness with rsyslog as the
  # upstream RELP/TLS collector (imrelp, name mode, Direct queue, sync on;
  # D2-9). Required mode turns every check that cannot run into a failure,
  # so a missing rsyslogd or openssl is never read as a pass. Go is set up for
  # the product binaries the suite builds as they merge. The Windows leg runs
  # on the owner's PC (D1-26); rsyslog does not run on Windows.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OTSEC_SLICE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsyslog rsyslog-relp openssl
      - run: rsyslogd -v && openssl version
      - run: python -m pip install pytest==9.1.1 asyncssh==2.24.1
      - run: python -m pytest -q -rs tests/integration/slice --ignore=tests/integration/slice/test_slice_interruptions_e2e.py --ignore=tests/integration/slice/test_slice_buffer_e2e.py --ignore=tests/integration/slice/test_slice_store_full_e2e.py --ignore=tests/integration/slice/test_slice_busy_open_e2e.py --ignore=tests/integration/slice/test_slice_admin_relay_e2e.py --ignore=tests/integration/slice/test_slice_unknown_restart_e2e.py --ignore=tests/integration/slice/test_slice_date_orders_e2e.py --ignore=tests/integration/slice/test_slice_unknown_fill_outage_e2e.py --ignore=tests/integration/slice/test_slice_gtinj_feed_e2e.py --ignore=tests/integration/slice/test_slice_config_changes_e2e.py --ignore=tests/integration/slice/test_slice_gtinj_ser_e2e.py --ignore=tests/integration/slice/test_slice_vm7_e2e.py --ignore=tests/integration/slice/test_slice_vm8_sets_e2e.py --ignore=tests/integration/slice/test_slice_vm8_paired_e2e.py --ignore=tests/integration/slice/test_slice_vm1_e2e.py
