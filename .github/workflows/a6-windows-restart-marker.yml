# B6 diagnostic for #284 and #281: TestUnknownSpentAcrossRestarts lost a
# marker on the hosted Windows runner inside the full Go job (298dfda run 2,
# ec22a31 run 9). It passed 12 of 12 run alone (e6e11f3) and 12 of 12 beside
# the store-heavy packages (b8596fc on #281's stack, 634cbf3 on main), so
# only the full suite has shown it. This job runs the full suite as ci.yml's
# Windows go step does, -count times, so #281's stack (#285) and main (#286)
# are compared like for like, and a failure prints the listener's counters
# and goroutine stacks (restart_test.go, rig.why). a6-* workflows are B6's
# (handoffs/B6-handoff.md). No secrets, no services, no accounts; hosted
# runner only. Results are simulated and printed to the job log.
name: a6-windows-restart-marker
on:
  workflow_dispatch:
    inputs:
      count:
        description: "go test -count for the full suite"
        default: "3"
  pull_request:
    paths:
      - .github/workflows/a6-windows-restart-marker.yml
      - tests/integration/syslogreceive/**
      - modules/telemetry/receive/**
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # As ci.yml's go step, but every package runs -count times in one
      # test binary. -timeout is per package binary, so it is ci.yml's 12m
      # times the count, with room.
      - name: Full suite, repeated
        env:
          COUNT: ${{ github.event.inputs.count || '3' }}
        shell: pwsh
        run: |
          $timeout = "$([int]$env:COUNT * 15)m"
          go test -timeout $timeout -count $env:COUNT ./...
          exit $LASTEXITCODE
