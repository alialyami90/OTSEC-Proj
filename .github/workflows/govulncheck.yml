# Go vulnerability check (D4-3; written by B3, owned by B1, reviewed by B6).
# govulncheck reports known vulnerabilities in the root module's
# dependencies and in the Go toolchain that go.mod pins, counting only those
# the code can reach. It runs on every pull request that ci.yml runs on, with
# the same Markdown filter (D3-13), and weekly on main, so a vulnerability
# published after a merge is found without waiting for the next pull
# request. A finding fails the job; nothing here is allowed to fail.
name: govulncheck
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '**/testdata/**'
  schedule:
    # Mondays at 05:17 UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned (D4-3). The module proxy and checksum database verify it.
      GOVULNCHECK_VERSION: v1.9.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      # The site node and the collector ship for windows/amd64 (ADR-0007),
      # so the check runs for that target as well as Linux: a vulnerability
      # reachable only through Windows code is found too.
      # platform/experiments/phase0 is a separate module and is not checked.
      - name: govulncheck (linux/amd64)
        run: govulncheck -show verbose ./...
      - name: govulncheck (windows/amd64)
        if: ${{ !cancelled() }}
        env:
          GOOS: windows
          GOARCH: amd64
        run: govulncheck -show verbose ./...
