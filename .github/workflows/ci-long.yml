# The long slice legs, apart from ci.yml so that adding the `full-ci`
# label re-runs only these (the owner, 2026-11-13, D4-97; D6's B1 on
# #665). Moved from ci.yml unchanged except for the trigger.
# Project CI (A1). Runs the root Go module's vet and tests on Linux and on
# windows/amd64, the site node's primary build (ADR-0007), and the Python
# verification tests (ADR-0003: Python for verification tooling only).
# Tests that need the SEL manual text are environment-gated and skip here.
name: ci-long
on:
  # A pull request or a push to main that changes only Markdown or other
  # document files skips CI (owner, 2026-10-27 and 2026-11-01). Files under
  # testdata are read by tests, so they still trigger it.
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!**.pdf'
      - '!**.doc'
      - '!**.docx'
      - '!**.pptx'
      - '!**.xlsx'
      - '**/testdata/**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '**'
      - '!**.md'
      - '!**.pdf'
      - '!**.doc'
      - '!**.docx'
      - '!**.pptx'
      - '!**.xlsx'
      - '**/testdata/**'
permissions:
  contents: read
jobs:
  # The long slice files (7 to 9 minutes each), one job per file so each
  # stays inside its limit and they run beside the integration job, which
  # ignores exactly these (A1, #132; busy_open added by A6 with A1's
  # approval; admin_relay added by A6, #189's check;
  # unknown_restart added by A6, #198's check, with A1's approval;
  # unknown_fill_outage added by B6, #321, by B1's ruling under D2-13;
  # gtinj_feed added by C6, #402, by C1's ruling under D2-13;
  # config_changes (V-M2) added by C6 under D4-46;
  # gtinj_ser (V-M4's SER half, 913 reads, about 30 min) added by C6
  # under D4-47, with its own limit; vm7, V-M7's eleven nodes over
  # GT-ADV, about 4 min, added by C6 under P4-3-C6; vm8_sets and
  # vm8_paired, V-M8's set cases and its paired runs, about 5 and 8 min,
  # added by C6 under P4-3-C6: the paired runs execute as root in a
  # network namespace of their own, with the binaries built before it;
  # vm1, V-M1 over GT-MIB's agents, about 9 min, proposed by D6 under
  # D4-59 for D1's authorization: its step tees the output and then runs
  # M3's key search over it;
  # rsyslog, rsyslog_interruptions, rsyslog_store_full and framing, the
  # closing legs, about 3, 9, 8 and 1 min, added by D6 under P4-D6-H5
  # with D1's authorization: the node forwards to the rsyslogd installed
  # below, and tests/integration/slice/conftest.py keeps the four out of
  # the integration job's run of the directory).
  integration-long:
    # On a push to main always. On a pull request only once D1 adds the
    # `full-ci` label, after the reviewers' last pass, and on every later
    # push while the label stays. Without it the job shows as skipped,
    # and D1's merge check refuses a head with any skipped check run
    # (the owner, 2026-11-13, D4-97).
    if: >-
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.file == 'test_slice_gtinj_ser_e2e.py' && 50 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        file:
          - sensor_rig
          - test_slice_interruptions_e2e.py
          - test_slice_buffer_e2e.py
          - test_slice_store_full_e2e.py
          - test_slice_busy_open_e2e.py
          - test_slice_admin_relay_e2e.py
          - test_slice_unknown_restart_e2e.py
          - test_slice_date_orders_e2e.py
          - test_slice_unknown_fill_outage_e2e.py
          - test_slice_gtinj_feed_e2e.py
          - test_slice_config_changes_e2e.py
          - test_slice_gtinj_ser_e2e.py
          - test_slice_vm7_e2e.py
          - test_slice_vm8_sets_e2e.py
          - test_slice_vm8_paired_e2e.py
          - test_slice_vm1_e2e.py
          - test_slice_rsyslog_e2e.py
          - test_slice_rsyslog_interruptions_e2e.py
          - test_slice_rsyslog_store_full_e2e.py
          - test_slice_framing_e2e.py
    env:
      OTSEC_SLICE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsyslog rsyslog-relp openssl
        if: matrix.file != 'sensor_rig'
      - run: rsyslogd -v && openssl version
        if: matrix.file != 'sensor_rig'
      - run: python -m pip install pytest==9.1.1 asyncssh==2.24.1
      - run: python -m pytest -q -rs tests/integration/slice/${{ matrix.file }}
        if: matrix.file != 'test_slice_vm8_paired_e2e.py' && matrix.file != 'test_slice_vm1_e2e.py' && matrix.file != 'sensor_rig'
      # sensor_rig (D6, P4-4-R1, authorized by D1 in the brief): the self-tests
      # of the rigs that the sensor's tests will run on, written before any
      # sensor exists: the veth pair across two network namespaces, the timed
      # replayer, the C-11 run with its negative control, and the capability
      # check. They run as root, because they make namespaces and open packet
      # sockets. Every interface is a virtual one in a namespace made for the
      # test, never the runner's NIC. The leg installs no system package (pip
      # installs pytest above, as for every leg), and OTSEC_RIG_REQUIRED=1
      # turns a test that can't run into a failure. Only the tests that need
      # root run as root: the rig's logic tests, the C13 source's and the
      # checker's run unprivileged in the python job (D5 on #626). A
      # measurement that this runner's kernel can't make is a skip that says
      # UNKNOWN and why, and -rA prints it.
      - name: The sensor rig's self-tests, as root in network namespaces of their own
        if: matrix.file == 'sensor_rig'
        run: |
          uname -r; ip -V; command -v nft && nft --version || echo "no nft on this runner"
          sudo env "PATH=$PATH" OTSEC_RIG_REQUIRED=1 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -rA -p no:cacheprovider tests/integration/sensor_rig/test_rig_selftest.py
      - name: V-M1 over GT-MIB, then M3's key search over this step's own output
        if: matrix.file == 'test_slice_vm1_e2e.py'
        run: |
          set -o pipefail
          rc=0
          OTSEC_VM1_KEYS_OUT="$RUNNER_TEMP/vm1-keys.json" python -m pytest -q -rA tests/integration/slice/test_slice_vm1_e2e.py 2>&1 | tee "$RUNNER_TEMP/vm1-out.txt" || rc=$?
          python tests/integration/slice/vm1_keysearch.py "$RUNNER_TEMP/vm1-keys.json" "$RUNNER_TEMP/vm1-out.txt" || rc=1
          exit $rc
      - name: V-M8's paired runs, as root in a network namespace of their own
        if: matrix.file == 'test_slice_vm8_paired_e2e.py'
        run: |
          bin="$RUNNER_TEMP/vm8-bin"
          go build -tags otsec_testclock -o "$bin/otsec" ./cmd/otsec
          go build -o "$bin/otsec-collector" ./cmd/otsec-collector
          go build -o "$bin/slicehelper" ./tests/integration/slice/slicehelper
          sudo env "PATH=$PATH" OTSEC_SLICE_REQUIRED=1 OTSEC_VM8_BIN="$bin" unshare -n python -m pytest -q -rA -p no:cacheprovider tests/integration/slice/test_slice_vm8_paired_e2e.py
