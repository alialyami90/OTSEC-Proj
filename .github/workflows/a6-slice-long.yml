name: a6-slice-long
# A6: the long slice end-to-end files, one job per file, so each stays well
# inside its time limit and they run side by side. ci.yml's integration job
# deselects them on GitHub Actions (tests/integration/slice/conftest.py).
# Same setup and required mode as that job: a check that cannot run fails.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  slice-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        file:
          - test_slice_interruptions_e2e.py
          - test_slice_buffer_e2e.py
          - test_slice_store_full_e2e.py
    env:
      OTSEC_SLICE_REQUIRED: "1"
      OTSEC_SLICE_LONG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsyslog rsyslog-relp openssl
      - run: python -m pip install pytest==9.1.1 asyncssh==2.24.1
      - run: python -m pytest -q -rs tests/integration/slice/${{ matrix.file }}
