# B5 dry run for #230, not for merge: per-test times of the Go suite on the
# hosted Windows runner, under the same parallel package load as ci.yml's
# `go test ./...`, with a 40-minute package timeout so a slow package
# finishes and its times are recorded. Evidence class: simulated (hosted
# runner).
name: b5-windows-times-dryrun
on:
  push:
    branches: [claude/project-thread-g854rs-wintimes]
permissions:
  contents: read
jobs:
  times:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: go test ./... (json)
        shell: pwsh
        run: |
          go test -json -count=1 -timeout 40m ./... > "$env:RUNNER_TEMP\test.json"
          "exit $LASTEXITCODE"
      - name: Summary
        if: always()
        shell: pwsh
        run: python .github/workflows/b5_times.py "$env:RUNNER_TEMP\test.json"
