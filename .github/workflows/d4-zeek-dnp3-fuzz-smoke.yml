# TEMPORARY smoke of d4-zeek-dnp3-fuzz.yml (brief P4-4-HR23-FUZZ): the same
# steps with 60 seconds per target per build, run on a push to this branch
# because a workflow_dispatch workflow cannot be dispatched until it is on
# the default branch. It is removed before review and never merges. It is
# not the campaign. Its summary publishes counts only, as the real job's.
name: d4-zeek-dnp3-fuzz-smoke
on:
  push:
    branches: [agent/telemetry-hr23-fuzz]
    paths:
      - .github/workflows/d4-zeek-dnp3-fuzz-smoke.yml
      - modules/telemetry/experiments/engine-linux/zeek-patch/**
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      FUZZ: modules/telemetry/experiments/engine-linux/zeek-patch/fuzz/fuzz.sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk for the two builds (the runner's preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install clang 18, its libFuzzer and sanitizer runtimes, LLVM's coverage tools, and Zeek's build packages
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            clang-18 libclang-rt-18-dev llvm-18 bison cmake flex libfl-dev libmaxminddb-dev \
            libpcap-dev libssl-dev libuv1-dev ninja-build zlib1g-dev
      - name: Smoke only, not the campaign - 60 seconds per target per build
        run: sed -i 's/^HR23_FUZZ_SECONDS=.*/HR23_FUZZ_SECONDS=60/' modules/telemetry/experiments/engine-linux/zeek-patch/fuzz/fuzz.env
      - name: Build C1p and C2's fuzz targets (inputs checked first)
        run: sh "$FUZZ" build "$RUNNER_TEMP/hr23-fuzz"
      - name: The seeds, converted by the pinned script, against the corpus pin
        run: sh "$FUZZ" seeds "$RUNNER_TEMP/hr23-fuzz"
      - name: Smoke diagnosis only - each target started on an empty corpus with -runs=0 (no seed, no mutated input); prints the exit code and filtered start-up lines
        if: ${{ !cancelled() }}
        run: |
          w="$RUNNER_TEMP/hr23-fuzz/fuzz"
          for b in c1p c2; do
            echo "ZEEKPATH for $b: [$(cat "$w/$b/zeekpath")]"
            ldd "$w/$b/zeek-9.0.1/build/src/fuzzers/zeek-packet-fuzzer" | grep -E 'not found|zeek|broker|binpac' || true
            for t in dnp3_tcp dnp3_udp packet; do
              e=$(mktemp -d); rc=0
              env ZEEKPATH="$(cat "$w/$b/zeekpath")" ASAN_OPTIONS=detect_leaks=0:symbolize=0 \
                "$w/$b/zeek-9.0.1/build/src/fuzzers/zeek-$t-fuzzer" -runs=0 -detect_leaks=0 "$e" > "$e.log" 2>&1 || rc=$?
              echo "$b $t exit $rc"
              grep -o 'ERROR: AddressSanitizer: [a-z-]*' "$e.log" | head -3
              grep -vE 'Sanitizer|==[0-9]+==|^ *#[0-9]' "$e.log" | head -30 | cut -c1-300
              rc=0
              env ZEEKPATH="$(cat "$w/$b/zeekpath")" ASAN_OPTIONS=detect_leaks=0:symbolize=0:detect_odr_violation=1                 "$w/$b/zeek-9.0.1/build/src/fuzzers/zeek-$t-fuzzer" -runs=0 -detect_leaks=0 "$e" > "$e.log" 2>&1 || rc=$?
              echo "$b $t with detect_odr_violation=1: exit $rc"
              grep -o 'ERROR: AddressSanitizer: [a-z-]*' "$e.log" | head -3
              grep -vE 'Sanitizer|==[0-9]+==|^ *#[0-9]' "$e.log" | head -30 | cut -c1-300
            done
          done
      - name: dnp3_tcp, smoke
        run: sh "$FUZZ" campaign "$RUNNER_TEMP/hr23-fuzz" dnp3_tcp
      - name: dnp3_udp, smoke
        run: sh "$FUZZ" campaign "$RUNNER_TEMP/hr23-fuzz" dnp3_udp
      - name: packet, smoke
        run: sh "$FUZZ" campaign "$RUNNER_TEMP/hr23-fuzz" packet
      - name: Replay every input that gave a report, alone, on both builds
        run: sh "$FUZZ" replay "$RUNNER_TEMP/hr23-fuzz"
      - name: Coverage of C2's final corpus, and the coverage condition
        run: sh "$FUZZ" coverage "$RUNNER_TEMP/hr23-fuzz"
      - name: Summary and verdict
        if: ${{ !cancelled() }}
        run: |
          sh "$FUZZ" summary "$RUNNER_TEMP/hr23-fuzz" > "$RUNNER_TEMP/hr23-fuzz/summary.md"
          cat "$RUNNER_TEMP/hr23-fuzz/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
