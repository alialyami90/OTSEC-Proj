# D4's E-D4-03 for ADR-0009 (brief P4-4-S2, D4-86): the provisional engine,
# Zeek, on Linux, stock, with a probe script and with the ICSNPP-DNP3 and
# ICSNPP-Modbus packages, beside Suricata with and without midstream, over
# GT-PCAP and the public captures. It can only be started by hand
# (workflow_dispatch) and is not a project CI pipeline. Offline files only:
# each engine runs in a container pinned by digest with --network none, so
# no engine has a network; the runner keeps its own, which fetches the
# images, ICSNPP and the captures. Nothing captures a network or contacts a
# device. The DNP3 step also feeds each Zeek configuration through a pipe,
# and Suricata through a FIFO (the pipe case, D4-87). Every fetched thing is
# pinned and checked before it runs (modules/telemetry/experiments/
# engine-linux/pins.env, icsnpp.sha256, extra-captures.tsv, MANIFEST.tsv).
# Only the tables and versions are uploaded: no capture, no engine log, no
# binary. Evidence class: simulated (Linux), CI-Linux.
#
# The `dnp3-public` job installs no package: Docker and Python are on the
# hosted image. Only the `prp` job uses apt, for tshark 4.2.2, the labeller
# that prp_check.py pins; Ubuntu's archive signs it (apt checks the
# signature), and prp_check.py refuses any other version.
#
# The `hr23` job (brief P4-4-HR23, stage 3) runs only when the dispatch sets
# `hr23_build`. It checks zeek-patch/build.sh's refusals (selftest.sh), builds
# the project's Zeek 9.0.1 twice from one pinned, signature-checked tree,
# without and with option (i)'s patch (zeek-patch/), runs D4's unit and
# negative tests of the patch on both, then the three modes above with the
# two builds beside the stock image. The images never leave the runner: only
# the tables, versions and the build record are uploaded. Every HR-23 result
# is a rehearsal until D6 pins stage 2's cases and conditions.
#
# HR-25's option A, part HR25-B1 (D4-124): build.sh also builds C2A, the
# tree with option (i)'s patch and then A's, and A's mutant controls. Two
# more inputs, each of which runs the `hr23` job alone (the `dnp3-public`
# and `prp` jobs are skipped):
# - `build_only` builds and records the images, after selftest.sh, and runs
#   no engine over any capture (GT-PCAP, public, PRP or HR-23's) and no unit
#   test. It uploads only the build record. It wins over the other inputs.
#   test_build_only.py checks, from each condition read as a conjunction,
#   that every other step is skipped under it, and the same for hr25_unit.
# - `hr25_unit` builds the images and runs only D4's unit tests of A's
#   patch (run.sh hr25-unit) on D4's own synthetic inputs, under C2A and
#   its controls; no capture of GT-PCAP or of D6's cases is read.
name: d4-engine-linux-eval
on:
  workflow_dispatch:
    inputs:
      hr23_build:
        description: "Also build the project's Zeek (HR-23, option (i)) and run it beside the stock image"
        type: boolean
        default: false
      build_only:
        description: "Only build and record the project's Zeek images (HR-23 C1p and C2, HR-25 C2A and its controls), after selftest.sh; runs no engine over any capture"
        type: boolean
        default: false
      hr25_unit:
        description: "Build the images and run only D4's unit tests of HR-25 option A's patch (no capture of GT-PCAP or of D6's cases)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dnp3-public:
    if: ${{ !inputs.build_only && !inputs.hr25_unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch the public captures (pinned SHA-256s)
        run: sh modules/telemetry/experiments/ids-coverage/fetch_captures.sh "$RUNNER_TEMP/caps" || echo "one or more captures did not match; run.sh checks each again and drops it, its rows read not run (not fetched), and on refs/heads/main the public step then fails"
      - name: GT-PCAP cases (DNP3, and the derived Modbus moved port with its control), rebuilt and checked, under every configuration
        run: sh modules/telemetry/experiments/engine-linux/run.sh dnp3 "$RUNNER_TEMP/e-d4-03" "$RUNNER_TEMP/caps"
      - name: Public and extra captures under every configuration
        run: sh modules/telemetry/experiments/engine-linux/run.sh public "$RUNNER_TEMP/e-d4-03" "$RUNNER_TEMP/caps"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: d4-engine-linux-eval-dnp3-public
          path: |
            ${{ runner.temp }}/e-d4-03/dnp3.md
            ${{ runner.temp }}/e-d4-03/public.md
            ${{ runner.temp }}/e-d4-03/versions.txt
          if-no-files-found: warn
  prp:
    if: ${{ !inputs.build_only && !inputs.hr25_unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tshark (the labeller prp_check.py pins)
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark
          tshark -v | head -1
      - name: Fetch the public captures (pinned SHA-256s)
        run: sh modules/telemetry/experiments/ids-coverage/fetch_captures.sh "$RUNNER_TEMP/caps" || echo "one or more captures did not match; the PRP step checks the nine it needs"
      - name: PRP pairs under every configuration, checked by E-D4-02's compare.py
        run: sh modules/telemetry/experiments/engine-linux/run.sh prp "$RUNNER_TEMP/e-d4-03" "$RUNNER_TEMP/caps"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: d4-engine-linux-eval-prp
          path: |
            ${{ runner.temp }}/e-d4-03/prp.md
            ${{ runner.temp }}/e-d4-03/versions.txt
          if-no-files-found: warn
  hr23:
    if: ${{ inputs.hr23_build || inputs.build_only || inputs.hr25_unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk for the Zeek build (the runner's preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: build.sh refuses every changed input (selftest.sh, before any build)
        shell: bash
        run: sh modules/telemetry/experiments/engine-linux/zeek-patch/selftest.sh "$RUNNER_TEMP/hr23-selftest" | tee "$RUNNER_TEMP/hr23-selftest.md"
      - name: Build C1p, C2, C2A and the controls from one pinned tree
        id: build
        run: |
          sh modules/telemetry/experiments/engine-linux/zeek-patch/build.sh build "$RUNNER_TEMP/e-d4-03"
          cat "$RUNNER_TEMP/e-d4-03/images.env" >> "$GITHUB_ENV"
          df -h /
          docker system df
      - name: D4's unit and negative tests of the patch, on both builds
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.build_only && !inputs.hr25_unit }}
        run: sh modules/telemetry/experiments/engine-linux/run.sh hr23-unit "$RUNNER_TEMP/e-d4-03"
      - name: Install tshark (the labeller prp_check.py pins)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.build_only && !inputs.hr25_unit }}
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark
          tshark -v | head -1
      - name: Fetch the public captures (pinned SHA-256s)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.build_only && !inputs.hr25_unit }}
        run: sh modules/telemetry/experiments/ids-coverage/fetch_captures.sh "$RUNNER_TEMP/caps" || echo "one or more captures did not match; run.sh checks each again and drops it, its rows read not run (not fetched), and on refs/heads/main the public step then fails"
      - name: GT-PCAP cases under every configuration, the two builds included
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.build_only && !inputs.hr25_unit }}
        run: sh modules/telemetry/experiments/engine-linux/run.sh dnp3 "$RUNNER_TEMP/e-d4-03" "$RUNNER_TEMP/caps"
      - name: Public and extra captures under every configuration, the two builds included
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.build_only && !inputs.hr25_unit }}
        run: sh modules/telemetry/experiments/engine-linux/run.sh public "$RUNNER_TEMP/e-d4-03" "$RUNNER_TEMP/caps"
      - name: PRP pairs under every configuration, the two builds included
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.build_only && !inputs.hr25_unit }}
        run: sh modules/telemetry/experiments/engine-linux/run.sh prp "$RUNNER_TEMP/e-d4-03" "$RUNNER_TEMP/caps"
      - name: D4's unit tests of HR-25 option A's patch, on C2A and its controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.hr25_unit && !inputs.build_only }}
        run: sh modules/telemetry/experiments/engine-linux/run.sh hr25-unit "$RUNNER_TEMP/e-d4-03"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && inputs.build_only }}
        with:
          name: d4-engine-linux-eval-build
          path: |
            ${{ runner.temp }}/e-d4-03/zeek-build.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && !inputs.build_only }}
        with:
          name: d4-engine-linux-eval-hr23
          path: |
            ${{ runner.temp }}/hr23-selftest.md
            ${{ runner.temp }}/e-d4-03/hr23-unit.md
            ${{ runner.temp }}/e-d4-03/hr25-unit.md
            ${{ runner.temp }}/e-d4-03/zeek-build.txt
            ${{ runner.temp }}/e-d4-03/dnp3.md
            ${{ runner.temp }}/e-d4-03/public.md
            ${{ runner.temp }}/e-d4-03/prp.md
            ${{ runner.temp }}/e-d4-03/versions.txt
          if-no-files-found: warn
