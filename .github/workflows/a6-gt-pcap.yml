# D6 (P4-4-A6): GT-PCAP's PRP derived captures, for ADR-0009's PRP row.
# Fetches the public DNP3 and Modbus captures at their pinned SHA-256s
# (D4's fetch script, read only), derives the PRP pairs with prp.py, checks
# them against the committed hashes, has tshark's own PRP dissector read
# every trailer, and writes the flow labels for D4's and D2's review.
#
# Linux only, no secrets, read-only token, no network capture: it reads
# files and contacts no device. It runs by hand and on pull requests that
# change this file or GT-PCAP. The derived captures are not uploaded,
# because the public sources state no redistribution terms; prp.py
# rebuilds them byte for byte. The labeller is pinned in prp_check.py, and a
# different tshark fails the run (D4 on #529). D1 ruled on #529 that this
# runs on its pull request paths, so no GT-PCAP change merges without
# tshark's verdict. Evidence class: simulated.
name: a6-gt-pcap
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/a6-gt-pcap.yml'
      - 'tests/integration/gt_pcap/**'
      - 'tests/fixtures/network/gt-pcap/**'
permissions:
  contents: read
jobs:
  prp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark
          tshark -v | head -1
      - name: Fetch the public captures (pinned SHA-256s)
        run: sh modules/telemetry/experiments/ids-coverage/fetch_captures.sh "$RUNNER_TEMP/caps"
      - name: Derive the PRP pairs
        run: |
          for f in dnp3-read dnp3-write dnp3-select-operate dnp3-malformed dnp3-digitalbond-part1 dnp3-digitalbond-part2 modbus modbus-digitalbond-part1 modbus-digitalbond-part2; do
            python3 tests/integration/gt_pcap/prp.py "$RUNNER_TEMP/caps/$f.pcap" "$RUNNER_TEMP/prp"
          done
      - name: Check the derived captures against the committed hashes
        run: cd "$RUNNER_TEMP/prp" && sha256sum -c "$GITHUB_WORKSPACE/tests/fixtures/network/gt-pcap/prp-derived.sha256"
      - name: Read every trailer with tshark, and write the labels
        run: python3 tests/integration/gt_pcap/prp_check.py "$RUNNER_TEMP/prp" "$RUNNER_TEMP/labels"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-pcap-prp-labels
          path: ${{ runner.temp }}/labels/
          if-no-files-found: warn
  # The DNP3 sources (plan sections 2B, 2C, 3 and 4): dnp3_cases.py writes
  # every capture frame by frame, the hashes pin the bytes, and the pinned
  # tshark's reading of them must give the committed labels exactly. The
  # captures are rebuilt here, never committed.
  dnp3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark
          tshark -v | head -1
      - name: Write the DNP3 captures
        run: python3 tests/integration/gt_pcap/dnp3_cases.py "$RUNNER_TEMP/dnp3"
      - name: Check them against the committed hashes
        run: cd "$RUNNER_TEMP/dnp3" && sha256sum -c "$GITHUB_WORKSPACE/tests/fixtures/network/gt-pcap/dnp3/dnp3.sha256"
      - name: Label them with tshark (checksums, CRCs, sa per C13)
        run: python3 tests/integration/gt_pcap/gtlabel.py "$RUNNER_TEMP/dnp3"
      - name: The labels equal the committed ones
        run: |
          cd tests/fixtures/network/gt-pcap/dnp3
          for f in *.tsv dnp3-cases.json; do diff -u "$f" "$RUNNER_TEMP/dnp3/$f"; done
          ls "$RUNNER_TEMP"/dnp3/*.tsv | wc -l | grep -qx "$(ls *.tsv | wc -l)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-pcap-dnp3
          path: ${{ runner.temp }}/dnp3/
          if-no-files-found: warn
  # The PRP pairs for the discard stage's comparison (P4-D6-GT2; plan
  # section 2C; C13 0.2's CH-28 and test P-2). prp_pairs.py writes the
  # capture, the hashes pin it, and prp_pairs_label.py places each frame's
  # tag and RCT from the pinned tshark's fields, checks the writer's claim
  # for every pair against CH-28 on the bytes, and writes the label, which
  # must equal the committed one. The capture is rebuilt here, never
  # committed.
  prp-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark
          tshark -v | head -1
      - name: Write the PRP pairs, and check them against the committed hashes
        run: |
          python3 tests/integration/gt_pcap/prp_pairs.py "$RUNNER_TEMP/pairs"
          cd "$RUNNER_TEMP/pairs" && sha256sum -c "$GITHUB_WORKSPACE/tests/fixtures/network/gt-pcap/prp-pairs/prp-pairs.sha256"
      - name: Label them with tshark, and check every pair's claim
        run: python3 tests/integration/gt_pcap/prp_pairs_label.py "$RUNNER_TEMP/pairs"
      - name: The label equals the committed one
        run: diff -u tests/fixtures/network/gt-pcap/prp-pairs/prp-pairs.tsv "$RUNNER_TEMP/pairs/prp-pairs.tsv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-pcap-prp-pairs
          path: ${{ runner.temp }}/pairs/prp-pairs.tsv
          if-no-files-found: warn
  # Modbus/TCP on a moved port (D1 on #623; plan sections 2B and 2C).
  # GT-PCAP has no Modbus/TCP writer, so the case is derived from the public
  # capture modbus.pcap: movedport.py rewrites its server port and nothing
  # else, the hash pins the result, and the pinned tshark's reading of it,
  # with that port decoded as Modbus/TCP, must give the committed label
  # exactly. modbus_label.py also checks the derived capture against its
  # source. Only the label is uploaded, never the capture.
  modbus-moved-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark
          tshark -v | head -1
      - name: Fetch the public captures (pinned SHA-256s)
        run: sh modules/telemetry/experiments/ids-coverage/fetch_captures.sh "$RUNNER_TEMP/caps"
      - name: Derive the capture, and check it against the committed hash
        run: |
          python3 tests/integration/gt_pcap/movedport.py "$RUNNER_TEMP/caps/modbus.pcap" "$RUNNER_TEMP/modbus"
          cd "$RUNNER_TEMP/modbus" && sha256sum -c "$GITHUB_WORKSPACE/tests/fixtures/network/gt-pcap/modbus/modbus-moved-port.sha256"
      - name: Label it with tshark, and check it against its source
        run: python3 tests/integration/gt_pcap/modbus_label.py "$RUNNER_TEMP/caps/modbus.pcap" "$RUNNER_TEMP/modbus/modbus-moved-port.pcap" 15020 "$RUNNER_TEMP/modbus/modbus-moved-port.tsv"
      - name: The label equals the committed one
        run: diff -u tests/fixtures/network/gt-pcap/modbus/modbus-moved-port.tsv "$RUNNER_TEMP/modbus/modbus-moved-port.tsv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-pcap-modbus-moved-port
          path: ${{ runner.temp }}/modbus/modbus-moved-port.tsv
          if-no-files-found: warn
