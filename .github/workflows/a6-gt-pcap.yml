# D6 (P4-4-A6): GT-PCAP's PRP derived captures, for ADR-0009's PRP row.
# Fetches the public DNP3 and Modbus captures at their pinned SHA-256s
# (D4's fetch script, read only), derives the PRP pairs with prp.py, checks
# them against the committed hashes, has tshark's own PRP dissector read
# every trailer, and writes the flow labels for D4's and D2's review.
#
# Linux only, no secrets, read-only token, no network capture: it reads
# files and contacts no device. It runs by hand and on pull requests that
# change this file or GT-PCAP. The derived captures are not uploaded,
# because the public sources state no redistribution terms; prp.py
# rebuilds them byte for byte. The labeller is pinned in prp_check.py, and a
# different tshark fails the run (D4 on #529). D1 ruled on #529 that this
# runs on its pull request paths, so no GT-PCAP change merges without
# tshark's verdict. Evidence class: simulated.
name: a6-gt-pcap
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/a6-gt-pcap.yml'
      - 'tests/integration/gt_pcap/**'
      - 'tests/fixtures/network/gt-pcap/**'
permissions:
  contents: read
jobs:
  prp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark
          tshark -v | head -1
      - name: Fetch the public captures (pinned SHA-256s)
        run: sh modules/telemetry/experiments/ids-coverage/fetch_captures.sh "$RUNNER_TEMP/caps"
      - name: Derive the PRP pairs
        run: |
          for f in dnp3-read dnp3-write dnp3-select-operate dnp3-malformed dnp3-digitalbond-part1 dnp3-digitalbond-part2 modbus modbus-digitalbond-part1 modbus-digitalbond-part2; do
            python3 tests/integration/gt_pcap/prp.py "$RUNNER_TEMP/caps/$f.pcap" "$RUNNER_TEMP/prp"
          done
      - name: Check the derived captures against the committed hashes
        run: cd "$RUNNER_TEMP/prp" && sha256sum -c "$GITHUB_WORKSPACE/tests/fixtures/network/gt-pcap/prp-derived.sha256"
      - name: Read every trailer with tshark, and write the labels
        run: python3 tests/integration/gt_pcap/prp_check.py "$RUNNER_TEMP/prp" "$RUNNER_TEMP/labels"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-pcap-prp-labels
          path: ${{ runner.temp }}/labels/
          if-no-files-found: warn
